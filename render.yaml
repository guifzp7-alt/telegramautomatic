services:
  - type: web
    name: telegram-disparador
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TARGET_CHAT_ID
        sync: false
      - key: PANEL_USER
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: FLASK_SECRET
        sync: false
